<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3eb"/><stop offset="1" stop-color="#e9e3d8"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff755b"/><stop offset="1" stop-color="#dc3f4d"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182c52"/><stop offset="1" stop-color="#0c1934"/></linearGradient>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14213d" flood-opacity=".18"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#182c52" stroke-opacity=".07" stroke-width="1"/></pattern>
    <style>
      .sans { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
      .ink { fill:#17233d; } .navy { fill:#f7f3eb; } .muted { fill:#687185; } .coral { fill:#e44c4c; }
      .label { font-size:22px; letter-spacing:4px; font-weight:700; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#paper)"/><rect x="0" y="0" width="1080" height="640" fill="url(#grid)"/>
  <path d="M0 1160H1080" stroke="#17233d" stroke-opacity=".12" stroke-width="2"/><circle cx="985" cy="145" r="155" fill="#e44c4c" opacity=".10"/><circle cx="95" cy="1720" r="220" fill="#2b80c9" opacity=".08"/>
  <g class="sans">
    <text x="72" y="94" class="ink label">CODEX / DISPOSABLE CONTEXT</text><text x="1008" y="94" text-anchor="end" class="muted mono" font-size="20">ISSUE 01 · 2026</text>
    <text x="72" y="226" class="ink" font-size="118" font-weight="800">事件完成，</text><text x="72" y="352" class="ink" font-size="118" font-weight="800">旧上下文退场</text>
    <rect x="72" y="402" width="480" height="48" rx="24" fill="url(#coral)"/><text x="96" y="436" fill="#fffaf3" font-size="28" font-weight="700">不是等满了才抛，而是做完就换。</text><text x="1008" y="436" text-anchor="end" class="muted" font-size="24">阶段性次抛 / event-driven rotation</text>

    <!-- One page leaves while the next page takes over. -->
    <g filter="url(#paperShadow)"><rect x="72" y="535" width="360" height="465" rx="22" fill="url(#blue)"/><rect x="648" y="505" width="360" height="495" rx="22" fill="#fffdf8" stroke="#17233d" stroke-width="3"/></g>
    <text x="112" y="595" fill="#ff806c" class="mono" font-size="20" letter-spacing="3">OLD CONTEXT</text><text x="112" y="654" class="navy" font-size="46" font-weight="800">这一页，完成。</text><path d="M112 706H390" stroke="#f7f3eb" stroke-opacity=".25" stroke-width="2"/>
    <text x="112" y="766" fill="#aab6c8" class="mono" font-size="22">result      ✓ ready</text><text x="112" y="820" fill="#aab6c8" class="mono" font-size="22">constraints ✓ kept</text><text x="112" y="874" fill="#aab6c8" class="mono" font-size="22">trace_id    #7F2A</text><text x="112" y="940" fill="#ff806c" font-size="24" font-weight="700">EVENT_CLOSED</text>
    <text x="688" y="567" class="coral mono" font-size="20" letter-spacing="3">NEXT EVENT</text><text x="688" y="638" class="ink" font-size="48" font-weight="800">只带必要的。</text><path d="M688 680H970" stroke="#17233d" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="706" cy="735" r="8" fill="#e44c4c"/><text x="730" y="744" class="ink mono" font-size="23">handoff.json</text><circle cx="706" cy="795" r="8" fill="#e44c4c"/><text x="730" y="804" class="ink mono" font-size="23">constraints</text><circle cx="706" cy="855" r="8" fill="#e44c4c"/><text x="730" y="864" class="ink mono" font-size="23">trace_id</text>
    <text x="688" y="938" class="muted" font-size="23">下一步从干净的边界继续，</text><text x="688" y="970" class="muted" font-size="23">不再背着上一页赶路。</text>
    <path d="M423 780H663" stroke="#e44c4c" stroke-width="12" stroke-linecap="round"/><path d="M640 750L678 780L640 810" fill="none" stroke="#e44c4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-7 540 700)"><rect x="442" y="650" width="190" height="54" rx="7" fill="#f6c84c"/><text x="537" y="686" text-anchor="middle" class="ink mono" font-size="23" font-weight="700">HANDOFF</text></g><text x="540" y="855" text-anchor="middle" class="muted mono" font-size="18" letter-spacing="2">ONE EVENT / ONE PAGE</text>

    <text x="72" y="1088" class="ink label">THE LOOP / 三步闭环</text><path d="M72 1120H1008" stroke="#17233d" stroke-width="3"/>
    <text x="72" y="1195" class="coral mono" font-size="56" font-weight="700">01</text><text x="72" y="1248" class="ink" font-size="34" font-weight="800">监听完成</text><text x="72" y="1288" class="muted" font-size="20">捕获 done / success / timeout</text>
    <path d="M352 1170V1305" stroke="#17233d" stroke-opacity=".18" stroke-width="2"/><text x="402" y="1195" class="coral mono" font-size="56" font-weight="700">02</text><text x="402" y="1248" class="ink" font-size="34" font-weight="800">次抛替换</text><text x="402" y="1288" class="muted" font-size="20">只留结果、约束、trace_id</text>
    <path d="M682 1170V1305" stroke="#17233d" stroke-opacity=".18" stroke-width="2"/><text x="732" y="1195" class="coral mono" font-size="56" font-weight="700">03</text><text x="732" y="1248" class="ink" font-size="34" font-weight="800">新页接管</text><text x="732" y="1288" class="muted" font-size="20">注入 handoff，继续执行</text>

    <text x="72" y="1400" class="ink label">WHO DOES WHAT / 组件分工</text>
    <rect x="72" y="1436" width="292" height="132" rx="18" fill="#17233d"/><rect x="394" y="1436" width="292" height="132" rx="18" fill="#e44c4c"/><rect x="716" y="1436" width="292" height="132" rx="18" fill="#2b80c9"/>
    <text x="100" y="1484" class="navy mono" font-size="21" letter-spacing="2">HOOK</text><text x="100" y="1530" class="navy" font-size="30" font-weight="800">负责触发</text><text x="422" y="1484" fill="#fffaf3" class="mono" font-size="21" letter-spacing="2">ORCHESTRATOR</text><text x="422" y="1530" fill="#fffaf3" font-size="30" font-weight="800">负责换页</text><text x="744" y="1484" fill="#fffaf3" class="mono" font-size="21" letter-spacing="2">STATE_V1</text><text x="744" y="1530" fill="#fffaf3" font-size="30" font-weight="800">负责交接</text>
    <text x="72" y="1638" class="muted" font-size="24">事件决定“何时换”，状态决定“带什么”，新任务负责“接着做什么”。</text>
    <rect x="72" y="1710" width="936" height="94" rx="47" fill="#17233d"/><text x="540" y="1770" text-anchor="middle" fill="#fffaf3" font-size="34" font-weight="800">把一次性上下文，交给下一次事件。</text>
    <text x="72" y="1852" class="coral mono" font-size="19" letter-spacing="1">OPEN SOURCE / MIT LICENSE</text><text x="1008" y="1852" text-anchor="end" class="muted mono" font-size="19">github.com/q2522879285-source/codex-disposable-context</text>
  </g>
</svg>


